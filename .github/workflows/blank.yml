name: Build and Deploy Nginx App
on:
  push:
    branches: [ main ]
  workflow_dispatch: # For manual deployments when needed

env:
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/silverlake

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
 
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
 
      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
 
      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: ./webserver-docker
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=registry,ref=${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE_NAME }}:buildcache,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Deploy to server via SSH
        uses: appleboy/ssh-action@v0.1.5
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            APP_NAME="silverlake"
            IMAGE="${{ secrets.DOCKERHUB_USERNAME }}/silverlake:latest"
            
            # Pull the latest image
            docker pull $IMAGE
            
            # Gracefully handle existing container
            docker stop $APP_NAME 2>/dev/null || true
            docker rm $APP_NAME 2>/dev/null || true
            
            # Start the new container (Fixed formatting spaces and port mapping)
            docker run -d \
              --name $APP_NAME \
              --restart unless-stopped \
              -p 5000:80 \
              $IMAGE
            
            # Give it a moment to start up
            sleep 5
            
            # Verify it's actually working (Changed health endpoint to root '/')
            if curl -f http://localhost:5000/; then
              echo "🎉 Deployment successful!"
              # Clean up unused Docker images
              docker image prune -f
            else
              echo "❌ Health check failed!"
              # Show what went wrong
              docker logs $APP_NAME
              exit 1
            fi
